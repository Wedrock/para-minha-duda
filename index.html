<title>Para minha Duda</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Tela única, escura de propósito: o palco é um terminal à noite. */
  :root {
    --bg: #07050b;
    --fg: #ead9f0;
    --muted: #8a7a99;
    --rose: #ff6996;
    --gold: #ffb255;
    --ring: #ffb255;
    --mono: "JetBrains Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; background: var(--bg); color: var(--fg); }
  body { margin: 0; overflow: hidden; font-family: var(--mono); }

  .palco {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: radial-gradient(ellipse at 50% 70%, #140b16 0%, var(--bg) 70%);
  }
  canvas { display: block; max-width: 100%; }

  .capa {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: color-mix(in srgb, var(--bg) 62%, transparent);
    transition: opacity .6s ease;
  }
  .capa.sumindo { opacity: 0; pointer-events: none; }
  .capa-box { display: grid; gap: 22px; justify-items: center; text-align: center; }
  .capa h1 {
    margin: 0; font-weight: 600; font-size: clamp(22px, 6vw, 34px);
    letter-spacing: .02em; text-wrap: balance;
    color: var(--fg);
  }
  .capa h1 span { color: var(--rose); }
  .capa p { margin: 0; color: var(--muted); font-size: 13px; letter-spacing: .04em; }
  button {
    font: 600 15px/1 var(--mono);
    color: var(--bg); background: var(--gold);
    border: 0; border-radius: 999px; padding: 16px 28px; cursor: pointer;
    box-shadow: 0 0 32px color-mix(in srgb, var(--gold) 45%, transparent);
  }
  button:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }
  @media (prefers-reduced-motion: reduce) { .capa { transition: none; } }
</style>

<div class="palco"><canvas id="tela" aria-label="Duas pessoas feitas de letras dançando"></canvas></div>
<div class="capa" id="capa">
  <div class="capa-box">
    <h1><span>♥</span> para minha Duda <span>♥</span></h1>
    <p>liga o som</p>
    <button id="play" type="button">▶ dançar</button>
  </div>
</div>

    const q = p[nome], sc = q.sc, lado = q.lado, cphi = Math.cos(q.phi);
    const hy = FLOOR - 31 * sc * 0.96 + q.bob;
    const hip = [q.hx, hy], tronco = 22 * sc;
    const neck = [hip[0] + Math.sin(q.lean) * tronco, hip[1] - Math.cos(q.lean) * tronco];
    const ang = q.lean + q.tilt;
    const head = [neck[0] + Math.sin(ang) * 6.5 * sc, neck[1] - Math.cos(ang) * 6.5 * sc];
    const sw = 6.3 * sc * (0.35 + 0.65 * Math.abs(cphi));
    const shIn = [neck[0] - lado * sw * (cphi >= 0 ? 1 : -1), neck[1] + 2.2];
    ombros[nome] = { in: shIn, out: [2 * neck[0] - shIn[0], neck[1] + 2.2] };
    esq[nome] = { hip, neck, head, sc, cphi };
  }
  const alvos = maos(t, p, ombros);

  for (const nome of "AB") {
    const q = p[nome], cfg = PESSOAS[nome], cor = cfg.cor, corCab = cfg.cabelo;
    const { hip, neck, head, sc, cphi } = esq[nome];
    const lado = q.lado, zb = nome === "A" ? 10 : 12, bracoZ = nome === "A" ? 30 : 26;
    const hw = 3.6 * sc * (0.45 + 0.55 * Math.abs(cphi));

    [-1, 1].forEach((sgn, i) => {
      const h = [hip[0] + sgn * hw, hip[1]];
      let pe = [hip[0] + sgn * (5.5 * sc * (0.4 + 0.6 * Math.abs(cphi))) + q.sway * 1.2, FLOOR - q.pes[i]];
      const r = ik(h, pe, 16 * sc, 15 * sc, 0.6), joelho = r[0]; pe = r[1];
      formas.push(capsula(h, joelho, 3.3 * sc, zb, cor, nome));
      formas.push(capsula(joelho, pe, 2.7 * sc, zb, cor, nome));
      formas.push(capsula(pe, [pe[0] + sgn * 2.5, pe[1]], 1.6, zb, cor, nome));
    });

    const meio = lerp2(neck, hip, 0.45);
    formas.push(elipse(lerp2(neck, meio, 0.55), 5.6 * sc * (0.55 + 0.45 * Math.abs(cphi)), 7.5 * sc, zb + 1, cor, nome));
    formas.push(capsula(meio, hip, 4.3 * sc * (0.6 + 0.4 * Math.abs(cphi)), zb + 1, cor, nome));
    formas.push(capsula(neck, [neck[0], neck[1] - 2], 1.8 * sc, zb + 1, cor, nome));

    const roda = q.giroVel;
    if (cfg.saia) formas.push(trapezio(hip[0], hip[1] - 4, 4.5 * sc, hip[1] + 13 + 2 * roda, (7.5 + 6 * roda) * sc, zb + 2, cor, nome));
    else if (roda > 0.05) formas.push(trapezio(hip[0], hip[1] - 2, 4 * sc, hip[1] + 4 + 4 * roda, (4.5 + 5 * roda) * sc, zb + 2, cor, nome));

    if (cfg.cabeloLongo) {
      const costas = 1 - (cphi + 1) / 2;
      formas.push(elipse([head[0] - 0.4 * lado, head[1] + 6 * sc], 6.3 * sc, 11 * sc, zb - 1 + (costas > 0.5 ? 20 : 0), corCab, nome));
    }
    formas.push(elipse(head, 4.7 * sc, 5.6 * sc, zb + 3, cor, nome));
    formas.push(elipse([head[0], head[1] - 3.4 * sc], 5.0 * sc, 2.8 * sc, zb + 4, corCab, nome));

    for (const qual of ["in", "out"]) {
      const sh = ombros[nome][qual];
      const ladoBraco = qual === "in" ? lado : -lado;
      const [cot, mao] = ik(sh, alvos[nome][qual], 12 * sc, 12 * sc, (ladoBraco > 0 ? 1 : -1) * 0.9);
      formas.push(capsula(sh, cot, 2.4 * sc, bracoZ, cor, nome));
      formas.push(capsula(cot, mao, 2.0 * sc, bracoZ, cor, nome));
      formas.push(elipse(mao, 1.8, 1.8, bracoZ, cor, nome));
    }
  }

  const k = smooth(15.8, 17.6, t);
  if (k > 0) {
    const top = Math.min(esq.A.head[1], esq.B.head[1]);
    const pulso = 1 + 0.07 * Math.max(0, Math.sin(2 * Math.PI * (t - BEAT0) / BEAT));
    const cx = (esq.A.head[0] + esq.B.head[0]) / 2;
    formas.push(coracao([cx, top - 9 - 2 * k], 7 * k * pulso, 50, [255, 55, 90]));
  }
  return [formas, esq];
}

// ------------------------------------------------------------ render da grade
const fade = t => smooth(0, 1, t) * (1 - smooth(DURACAO - 1, DURACAO, t));

function frame(t) {
  const [formas, esq] = montar(t);
  const ch = new Array(COLS * ROWS).fill(null), cor = new Array(COLS * ROWS), zbuf = new Int16Array(COLS * ROWS).fill(-1);
  const tick = Math.floor(t * 12), luz = fade(t);
  const tops = { A: esq.A.head[1] - 6, B: esq.B.head[1] - 6 };
  const put = (i, c, rgb) => { ch[i] = c; cor[i] = rgb; };

  formas.sort((a, b) => a.z - b.z);
  for (const f of formas) {
    const [x0, y0, x1, y1] = f.bbox;
    const c0 = Math.max(0, Math.floor(x0 * ZOOM)), c1 = Math.min(COLS - 1, Math.floor(x1 * ZOOM) + 1);
    const r0 = Math.max(0, Math.floor(y0 * ZOOM / 2)), r1 = Math.min(ROWS - 1, Math.floor(y1 * ZOOM / 2) + 1);
    for (let r = r0; r <= r1; r++) {
      const y = (2 * r + 1) / ZOOM;
      for (let c = c0; c <= c1; c++) {
        const i = r * COLS + c;
        const d = f.sdf((c + 0.5) / ZOOM, y);
        if (d >= 0.9 || f.z < zbuf[i]) continue;
        const hsh = h32(c, r, tick, f.z);
        if (d >= 0) {
          if (zbuf[i] < 0 && hsh % 5 === 0) put(i, ".", f.cor.map(v => v * 0.25 * luz));
          continue;
        }
        const prof = -d;
        const set = prof > 3.2 ? CORE : prof > 1.3 ? MID : EDGE;
        const topo = tops[f.fig] ?? y - 10;
        const alt = clamp((y - topo) / (FLOOR - topo), 0, 1);
        let b = clamp(0.62 + 0.14 * prof, 0.62, 1) * (1.12 - 0.42 * alt);
        if (prof <= 1.3) b *= 0.6;
        b *= (0.85 + 0.15 * ((hsh >>> 8) % 100) / 100) * luz;
        put(i, set[hsh % set.length], f.cor.map(v => clamp(v * b, 0, 255)));
        zbuf[i] = f.z;
      }
    }
  }

  const rf = Math.floor(FLOOR * ZOOM / 2);                          // reflexo
  for (let k = 1; k < 4 && rf + k < ROWS; k++)
    for (let c = 0; c < COLS; c++) {
      const s = (rf - k) * COLS + c;
      if (ch[s] && ch[s] !== "." && h32(c, k, tick) % 3) put((rf + k) * COLS + c, ch[s], cor[s].map(v => v * 0.22 / k));
    }

  if (t > 11.8)                                                     // coraçõezinhos
    for (let i = 0; i < 26; i++) {
      const nasc = 11.8 + (h32(i, 7) % 1000) / 1000 * 6.5;
      if (t < nasc) continue;
      const vida = t - nasc;
      const x = W / 2 + ((h32(i, 3) % 1000) / 1000 - 0.5) * 44 + 2 * Math.sin(vida * 2 + i);
      const y = FLOOR - 20 - vida * (6 + h32(i, 5) % 7);
      const r = Math.floor(y * ZOOM / 2), c = Math.floor(x * ZOOM);
      if (r >= 9 && r < ROWS && c >= 0 && c < COLS) {
        const a = clamp(1.2 - vida / 3.5, 0, 1) * luz;
        put(r * COLS + c, i % 3 ? "♥" : "*", [255 * a, 90 * a, 140 * a]);
      }
    }

  const escrever = (r, c, txt, rgb) => [...txt].forEach((s, j) => { if (c + j >= 0 && c + j < COLS) put(r * COLS + c + j, s, rgb); });
  const cab = '[Running] python -u "danca.py"';
  escrever(1, 2, cab.slice(0, Math.ceil(cab.length * smooth(0, 0.4, t))), [110, 130, 220]);
  LETRA.forEach(([ini, fim, txt], i) => {
    if (t < ini) return;
    const n = Math.ceil(txt.length * clamp((t - ini) / (fim - ini), 0, 1));
    escrever(3 + i, 2, txt.slice(0, n), [215, 200, 255].map(v => v * luz));
  });
  if (t > 16.4) {
    const n = Math.ceil(DEDICATORIA.length * clamp((t - 16.4) / 1.6, 0, 1));
    escrever(ROWS - 1, Math.floor((COLS - DEDICATORIA.length) / 2), DEDICATORIA.slice(0, n), [255, 190, 215].map(v => v * luz));
  }
  return [ch, cor];
}

// ------------------------------------------------------------ canvas
const tela = document.getElementById("tela"), ctx = tela.getContext("2d");
let cw = 8;
function ajustar() {
  const box = tela.parentElement.getBoundingClientRect();
  const cs = getComputedStyle(tela.parentElement);
  const livreW = box.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const livreH = box.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  cw = Math.max(2, Math.min(livreW / COLS, livreH / (ROWS * 2)));
  const dpr = window.devicePixelRatio || 1;
  tela.style.width = cw * COLS + "px";
  tela.style.height = cw * 2 * ROWS + "px";
  tela.width = Math.round(cw * COLS * dpr);
  tela.height = Math.round(cw * 2 * ROWS * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function desenhar(t) {
  const [ch, cor] = frame(t);
  ctx.clearRect(0, 0, cw * COLS, cw * 2 * ROWS);
  ctx.font = `${(cw * 1.3).toFixed(2)}px ${getComputedStyle(document.documentElement).getPropertyValue("--mono")}`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  let ultima = "";
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      const i = r * COLS + c;
      if (!ch[i]) continue;
      const rgb = cor[i], fs = `rgb(${rgb[0] | 0},${rgb[1] | 0},${rgb[2] | 0})`;
      if (fs !== ultima) { ctx.fillStyle = fs; ultima = fs; }
      ctx.fillText(ch[i], (c + 0.5) * cw, (r + 0.5) * cw * 2);
    }
}

// ------------------------------------------------------------ som + relógio
const capa = document.getElementById("capa"), botao = document.getElementById("play");
const audio = new Audio(MUSICA);
audio.preload = "auto";
let tocando = false, base = 0;
const PREVIA = 17.2;

function relogio() {
  let t = (performance.now() - base) / 1000;
  if (!audio.paused && Math.abs(t - audio.currentTime) > 0.25) {   // corrige se o áudio escorregar
    base = performance.now() - audio.currentTime * 1000;
    t = audio.currentTime;
  }
  return t;
}
function loop() {
  if (!tocando) return;
  const t = relogio();
  if (t >= DURACAO) { terminar(); return; }
  desenhar(t);
  requestAnimationFrame(loop);
}
function terminar() {
  tocando = false;
  desenhar(PREVIA);
  botao.textContent = "↻ dançar de novo";
  capa.classList.remove("sumindo");
}
botao.addEventListener("click", () => {
  audio.currentTime = 0;
  const p = audio.play();
  base = performance.now();
  tocando = true;
  capa.classList.add("sumindo");
  requestAnimationFrame(loop);
  if (p && p.catch) p.catch(() => {});                              // sem som ainda dança
});
audio.addEventListener("playing", () => { base = performance.now() - audio.currentTime * 1000; });
audio.addEventListener("ended", () => { if (tocando) terminar(); });

window.addEventListener("resize", () => { ajustar(); if (!tocando) desenhar(PREVIA); });
ajustar();
desenhar(PREVIA);
document.fonts && document.fonts.ready.then(() => { if (!tocando) desenhar(PREVIA); });
</script>
